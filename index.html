<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="data.js"></script>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="assets/world.png" alt="worldPicture">
        <h1>Country Explorer</h1>
    </header>
    
    <form >
        <div class="form-group">
            <label for="countryName">Search by Country Name:</label>
            <input type="text" id="countryName" placeholder="Enter Country Name">
        </div>

        <div class="form-group">
            <label for="regionSelect">Select a Region:</label>
            <select name="region" id="regionSelect">
                <option value="">All Regions</option>
            </select>
        </div>

        <div class="form-group">
            <label for="populationInput">Search by Population:</label>
            <input type="number" id="populationInput" value="0">
            <span class="help-text">Max - 1.5 Billion (1500000000)</span>
        </div>
    </form>
    <main id="country-cards-container">
        <div id="cards"></div>
    </main>

    <button id="btn-show-more">Show more</button>
</body>
</html>
